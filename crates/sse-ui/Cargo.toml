[package]
name = "sse-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["native-ui"]
native-ui = [
    "dep:sse-companion",
    "dep:sse-fixes",
    "dep:sse-lint",
    "dep:sse-steam",
    "dep:sse-update",
]

[[bin]]
name = "sse-shell"
path = "src/bin/sse-shell.rs"
required-features = ["native-ui"]

[[bin]]
name = "sse-ui-dev"
path = "src/bin/sse-ui-dev.rs"
required-features = ["native-ui"]

[dependencies]
sse-core = { path = "../sse-core" }
sse-codecs = { path = "../sse-codecs" }
sse-sys = { path = "../sse-sys" }
sse-s2 = { path = "../sse-s2" }
sse-storage = { path = "../sse-storage" }
sse-xray = { path = "../sse-xray" }
sse-app = { path = "../sse-app" }
sse-catalog = { path = "../sse-catalog" }
sse-companion = { path = "../sse-companion", optional = true }
sse-content = { path = "../sse-content" }
sse-fixes = { path = "../sse-fixes", optional = true }
sse-lint = { path = "../sse-lint", optional = true }
sse-steam = { path = "../sse-steam", optional = true }
sse-update = { path = "../sse-update", optional = true }
sse-doctor = { path = "../sse-doctor" }

[lints]
workspace = true
