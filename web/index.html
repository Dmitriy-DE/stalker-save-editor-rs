<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>S.T.A.L.K.E.R. Save Editor</title>
    <style>
      :root { color-scheme: dark; background: #101418; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; background: #101418; }
      canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
      #status { position: fixed; inset: auto 1rem 1rem; color: #f4c56a; font: 14px system-ui, sans-serif; }
      #status a { color: inherit; text-decoration: underline; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="shell" tabindex="0" aria-label="S.T.A.L.K.E.R. Save Editor"></canvas>
    <output id="status" role="status">Loading editor…</output>
    <script type="module" src="./app.js"></script>
  </body>
</html>
