[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Small build cache: no debug info and no incremental state in dev/test builds (the shared target fills the disk).
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
