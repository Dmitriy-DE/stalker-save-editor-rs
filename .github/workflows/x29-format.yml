name: x29-format
on:
  push:
    branches: ["wp/X29-regex"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp/X29-regex
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sse-lint/src/regex.rs crates/sse-lint/src/lib.rs
          git commit -m "Format X29 regex engine"
          git push origin HEAD:wp/X29-regex
