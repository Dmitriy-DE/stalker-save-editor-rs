name: x6b-check
on:
  push:
    branches: ["wp/X6b-fonts"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --release -p sse-codecs rasterizer_16px_benchmark -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x6b-checked-font
          path: crates/sse-codecs/src/font.rs
