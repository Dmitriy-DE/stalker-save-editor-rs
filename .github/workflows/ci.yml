name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p sse-cli

      - name: UI performance budgets
        if: matrix.os == 'ubuntu-24.04'
        run: cargo run --release -p sse-ui --bin sse-shell -- --ci-budget

      - name: Translation button layout report
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          mkdir -p target/i18n-qa
          set -o pipefail
          cargo run --release -p sse-ui --bin sse-shell -- --ci-i18n-buttons | tee target/i18n-qa/buttons.txt

      - name: Upload translation layout report
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: i18n-button-layout
          path: target/i18n-qa/buttons.txt
          if-no-files-found: error

      - name: Fuzz smoke new save formats
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test -p sse-fuzz-smoke --release -- --nocapture

      - name: Render acceptance screenshots
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          mkdir -p target/acceptance-screenshots
          cargo run --release -p sse-ui --bin sse-shell -- --screenshot target/acceptance-screenshots/overview-940x600.png 940x600 0
          cargo run --release -p sse-ui --bin sse-shell -- --screenshot target/acceptance-screenshots/capabilities-940x600.png 940x600 17
          cargo run --release -p sse-ui --bin sse-shell -- --screenshot target/acceptance-screenshots/overview-1280x860.png 1280x860 0
          cargo run --release -p sse-ui --bin sse-shell -- --screenshot target/acceptance-screenshots/capabilities-1280x860.png 1280x860 17
      - name: Upload acceptance screenshots
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-screenshots
          path: target/acceptance-screenshots/*.png
          if-no-files-found: error

  test-build:
    # Unsigned test binaries for the owner after every merge into main; not a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p sse-cli -p sse-ui
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p test-build
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/release/sse-shell${ext}" "test-build/SaveEditor${ext}"
          cp "target/release/stalker-save${ext}" "test-build/stalker-save${ext}"
          git rev-parse --short HEAD > test-build/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test-build-${{ runner.os }}
          path: test-build/
          retention-days: 14
          if-no-files-found: error

  packages:
    # Unsigned release packages via tools/package.sh; run by hand or on a v* tag.
    # The owner signs the manifest locally with --manifest-only; no key lives in CI.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu x86_64-pc-windows-gnu
          - os: macos-14
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Toolchains
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do rustup target add "$t"; done
          if [ "${{ runner.os }}" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y mingw-w64; fi
      - name: Package
        shell: bash
        run: |
          args=""; for t in ${{ matrix.targets }}; do args="$args --target $t"; done
          tools/package.sh $args
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
