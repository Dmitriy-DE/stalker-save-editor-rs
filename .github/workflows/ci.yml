name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p sse-cli

      - name: UI performance budgets
        if: matrix.os == 'ubuntu-24.04'
        run: cargo run --release -p sse-ui --bin sse-shell -- --ci-budget

      - name: Fuzz smoke new save formats
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test -p sse-fuzz-smoke --release -- --nocapture

      - name: Localized layout QA
        if: matrix.os == 'ubuntu-24.04'
        run: cargo run --release -p sse-ui --bin sse-shell -- --ci-i18n-layout

      - name: Render acceptance screenshots
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          mkdir -p target/acceptance-screenshots
          for lang in en de fr uk; do
            for size in 940x600 1280x860; do
              STALKER_EDITOR_LANG="$lang" cargo run --release -p sse-ui --bin sse-shell -- --screenshot "target/acceptance-screenshots/overview-${lang}-${size}.png" "$size" 0
            done
          done
          STALKER_EDITOR_LANG=en cargo run --release -p sse-ui --bin sse-shell -- --screenshot target/acceptance-screenshots/capabilities-en-940x600.png 940x600 17
          STALKER_EDITOR_LANG=en cargo run --release -p sse-ui --bin sse-shell -- --screenshot target/acceptance-screenshots/capabilities-en-1280x860.png 1280x860 17
      - name: Upload acceptance screenshots
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-screenshots
          path: target/acceptance-screenshots/*.png
          if-no-files-found: error

  test-build:
    # Unsigned test binaries for the owner after every merge into main; not a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p sse-cli -p sse-ui
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p test-build
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/release/sse-shell${ext}" "test-build/SaveEditor${ext}"
          cp "target/release/stalker-save${ext}" "test-build/stalker-save${ext}"
          git rev-parse --short HEAD > test-build/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test-build-${{ runner.os }}
          path: test-build/
          retention-days: 14
          if-no-files-found: error
