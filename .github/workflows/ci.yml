name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p sse-cli

      - name: Install shipped Windows GNU target
        if: matrix.os == 'ubuntu-24.04'
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Compile tests for shipped Windows GNU target
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test --locked --workspace --target x86_64-pc-windows-gnu --no-run

      - name: Check declared Rust 1.85 MSRV
        if: matrix.os == 'ubuntu-24.04'
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --locked --workspace --all-targets

      - name: UI performance budgets
        if: matrix.os == 'ubuntu-24.04'
        run: cargo run --release -p sse-ui --bin sse-ui-dev -- --ci-budget

      - name: Translation button layout report
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          mkdir -p target/i18n-qa
          set -o pipefail
          cargo run --release -p sse-ui --bin sse-ui-dev -- --ci-i18n-buttons | tee target/i18n-qa/buttons.txt

      - name: Upload translation layout report
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: i18n-button-layout
          path: target/i18n-qa/buttons.txt
          if-no-files-found: error

      - name: Fuzz smoke new save formats
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test -p sse-fuzz-smoke --release -- --nocapture

      - name: Fuzz smoke unpacked X-Ray and S2 writer paths
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cargo test --locked -p sse-xray --release unpacked_image_mutation_repack_read_and_write_fuzz_smoke
          cargo test --locked -p sse-s2 --release unpacked_image_mutation_repack_read_and_write_fuzz_smoke

      - name: Render acceptance screenshots
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          mkdir -p target/acceptance-screenshots
          cargo run --release -p sse-ui --bin sse-ui-dev -- --screenshot target/acceptance-screenshots/overview-940x600.png 940x600 0
          cargo run --release -p sse-ui --bin sse-ui-dev -- --screenshot target/acceptance-screenshots/capabilities-940x600.png 940x600 17
          cargo run --release -p sse-ui --bin sse-ui-dev -- --screenshot target/acceptance-screenshots/overview-1280x860.png 1280x860 0
          cargo run --release -p sse-ui --bin sse-ui-dev -- --screenshot target/acceptance-screenshots/capabilities-1280x860.png 1280x860 17
      - name: Upload acceptance screenshots
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-screenshots
          path: target/acceptance-screenshots/*.png
          if-no-files-found: error

  test-build:
    # Unsigned test binaries for the owner after every merge into main; not a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p sse-cli -p sse-ui
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p test-build
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/release/sse-shell${ext}" "test-build/SaveEditor${ext}"
          cp "target/release/stalker-save${ext}" "test-build/stalker-save${ext}"
          git rev-parse --short HEAD > test-build/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test-build-${{ runner.os }}
          path: test-build/
          retention-days: 14
          if-no-files-found: error

  packages:
    # Unsigned release packages via tools/package.sh; run by hand or on a v* tag.
    # The owner signs the manifest locally with --manifest-only; no key lives in CI.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu x86_64-pc-windows-gnu
          - os: macos-14
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Toolchains
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do rustup target add "$t"; done
          if [ "${{ runner.os }}" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y mingw-w64; fi
      - name: Package
        shell: bash
        run: |
          args=""; for t in ${{ matrix.targets }}; do args="$args --target $t"; done
          tools/package.sh $args
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

  windows-installer:
    # Compile and smoke-check the upgrade installer on PRs and release runs.
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./tools/package-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/SaveEditor-windows-x86_64-setup.exe
            dist/SaveEditor-windows-x86_64-setup.exe.sha256
            dist/.package-metadata/windows-installer-x86_64.tsv
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

  release-manifest:
    # Assemble release metadata only after all package builders passed check.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [packages, windows-installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Download portable and native packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist/
          merge-multiple: true
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/
      - name: Build release manifest
        run: tools/package.sh --manifest-only
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: dist/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
