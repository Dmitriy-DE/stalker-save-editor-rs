name: x6b-format
on:
  push:
    branches: ["wp/X6b-fonts"]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: x6b-formatted-font
          path: crates/sse-codecs/src/font.rs
