name: x16b-format
on:
  push:
    branches: ["wp/X16b-kraken"]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: x16b-formatted
          path: crates/sse-codecs/src/kraken.rs
